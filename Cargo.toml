[package]
name = "sembra"
version = "0.1.0"
edition = "2021"
authors = ["Caleb"]
description = "Content-aware image resizing using seam carving"
license = "AGPL-3.0"
repository = "https://github.com/username/sembra"
keywords = ["image", "seam-carving", "resize", "content-aware"]
categories = ["multimedia::images", "algorithms"]

[lib]
name = "sembra"
path = "src/lib.rs"

[[bin]]
name = "sembra"
path = "src/bin/sembra.rs"

[dependencies]
clap = { version = "4.3", features = ["derive"] }
image = "0.24"
ndarray = "0.15"
ndarray-npy = "0.9"  # for optional .npy loading/saving if needed

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "seam_carving_bench"
harness = false

# Make the debug build faster
[profile.dev]
opt-level = 1

# Profile for performance analysis with symbols
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Release with debug info for profiling (Rust Performance Book recommendation)
[profile.release]
debug = true  # Full debug info for better profiling with perf
strip = false  # Don't strip symbols - needed for profiling!
